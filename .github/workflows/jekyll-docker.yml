<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Development Centre for Customs & Law Enforcement</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1a1a1a;
            line-height: 1.6;
        }

        header {
            background: #0b3c5d;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 18px;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        section {
            padding: 60px 40px;
            max-width: 1100px;
            margin: auto;
        }

        .hero {
            background: white;
            text-align: center;
            padding: 80px 40px;
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            max-width: 700px;
            margin: auto;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: #0b3c5d;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-left: 4px solid #0b3c5d;
        }

        footer {
            background: #0b3c5d;
            color: white;
            padding: 30px 40px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>Professional Development Centre</h1>
    <nav>
        <a href="#about">About</a>
        <a href="#programmes">Programmes</a>
        <a href="#law">Law Enforcement</a>
        <a href="#international">International</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Training and Capacity Building for Customs and Law Enforcement</h2>
    <p>
        We provide professional training programmes for customs authorities,
        law enforcement agencies and public institutions with a strong focus
        on practical skills and international cooperation.
    </p>
    <a href="#programmes" class="button">Explore Programmes</a>
</section>

<section id="about">
    <h2>About the Centre</h2>
    <p>
        The Professional Development Centre operates as a national training
        hub with international cooperation focus. Our mission is to strengthen
        institutional capacity through education, training and applied expertise.
    </p>
</section>

<section id="programmes">
    <h2>Training Programmes</h2>
    <div class="grid">
        <div class="card">
            <h3>Customs Law Enforcement</h3>
            <p>
                Practical training programme focused on investigative tools,
                risk analysis and enforcement mechanisms in customs operations.
            </p>
        </div>

        <div class="card">
            <h3>Anti-Smuggling & Risk Management</h3>
            <p>
                Capacity building for customs officers dealing with smuggling,
                fraud prevention and border security challenges.
            </p>
        </div>

        <div class="card">
            <h3>Train the Trainers</h3>
            <p>
                Programme designed to prepare national trainers for sustainable
                delivery of professional training within institutions.
            </p>
        </div>
    </div>
</section>

<section id="law">
    <h2>Law Enforcement & Practical Training</h2>
    <p>
        Our programmes integrate practical components including simulations,
        operational scenarios and applied training facilities to ensure real-world
        readiness of participants.
    </p>
</section>

<section id="international">
    <h2>International Cooperation</h2>
    <p>
        The Centre cooperates with international partners, donors and institutions
        to support reforms, professional development and cross-border cooperation
        initiatives.
    </p>
</section>

<section id="contact">
    <h2>Contact</h2>
    <p>
        📧 Email: centre@example.org<br>
        📍 Location: Irpin, Ukraine
    </p>
</section>

<footer>
    © 2026 Professional Development Centre for Customs & Law Enforcement
</footer>

</body>
</html>
